name: Temporary APK transfer runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chat-apk-transfer-main.yml'

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat-apk-transfer
          fetch-depth: 1
      - name: Restore verified APK
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://release-assets.githubusercontent.com/github-production-release-asset/1280752406/9d97f616-457b-4d0e-a60a-14355ad25c75?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-08-24T16%3A43%3A29Z&rscd=attachment%3B+filename%3DAutopark-UA-v0.6-debug.apk.b64&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-08-24T15%3A42%3A54Z&ske=2026-08-24T16%3A43%3A29Z&sks=b&skv=2018-11-09&sig=QhM2%2BiaTA1x%2B9abjYYhmp3wbPhW6CM4ukpT7z12nY8c%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc4NzU4NzkzNSwibmJmIjoxNzg3NTg3NjM1LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.NzaimM1F5pvilC29JNB-9xAxXCsF8JDJBH3aB94T37w&response-content-disposition=attachment%3B%20filename%3DAutopark-UA-v0.6-debug.apk.b64&response-content-type=application%2Foctet-stream'
          curl -fL "$URL" -o /tmp/app.b64
          base64 -d /tmp/app.b64 > Autopark-UA-v0.6-debug.apk
          echo '96297b29dcf3ff3fe702361adcbbb143b7e6463f7eeffc3ebb24711133bd6094  Autopark-UA-v0.6-debug.apk' | sha256sum -c -
          test "$(stat -c '%s' Autopark-UA-v0.6-debug.apk)" = '174382'
      - name: Publish to temporary branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Autopark-UA-v0.6-debug.apk
          git diff --cached --quiet || git commit -m 'Temporary verified APK payload [skip ci]'
          git push origin HEAD:chat-apk-transfer
